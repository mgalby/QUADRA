# Tiene sveglio il progetto Supabase: il piano free lo sospende dopo circa 7 giorni
# senza attività. Due richieste a settimana (lunedì e giovedì) leggono una riga dal
# database; l'utente anonimo non ha permessi di lettura (è voluto), ma la richiesta arriva
# fino a Postgres e conta come attività.
# La publishable key (sb_publishable_…) va solo nell'intestazione apikey: non è un JWT.
# Servono due segreti del repository: SUPABASE_URL e SUPABASE_KEY (la publishable key).
name: Ping Supabase

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Richiesta al database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Mancano i segreti SUPABASE_URL e SUPABASE_KEY"; exit 1
          fi
          code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")
          echo "Risposta: $code"
          head -c 300 body.txt; echo
          # 200 = lettura riuscita; 401 con codice 42501 = il database ha risposto e ha negato
          # la lettura all'utente anonimo (le regole RLS fanno il loro lavoro): vale come ping.
          # Un progetto sospeso o irraggiungibile darebbe un altro errore.
          [ "$code" = "200" ] || grep -q '"code":"42501"' body.txt
